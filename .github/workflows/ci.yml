name: Проверить проект

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      has_go:
        description: Есть Go-модуль и точка входа движка
        value: ${{ jobs.structure.outputs.has_go }}

permissions:
  contents: read

jobs:
  structure:
    name: Документация и структура
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.inspect.outputs.has_go }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Проверить документацию и готовность Go-проекта
        id: inspect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          documents = ['README.md', 'TODO.md', 'CHANGELOG.md', 'AGENTS.md', 'THIRD_PARTY_NOTICES.md', 'testdata/reference/README.md']
          documents.extend(str(path) for path in sorted(Path('.').glob('todo_*.md')))
          documents.extend(str(path) for path in sorted(Path('docs').glob('*.md')))
          for name in documents:
              text = Path(name).read_text(encoding='utf-8')
              if not text.strip() or text.count('```') % 2:
                  raise SystemExit(f'Пустой документ или незакрытый блок кода: {name}')
              for target in re.findall(r'\]\(([^)]+)\)', text):
                  if '://' in target or target.startswith('#'):
                      continue
                  if not (Path(name).parent / target.split('#', 1)[0]).is_file():
                      raise SystemExit(f'Не найдена локальная ссылка в {name}: {target}')

          module = Path('go.mod').is_file()
          Path('gen/dart/pubspec.yaml').read_text(encoding='ascii')
          entry = Path('cmd/pob2-engine').is_dir()
          if module != entry:
              raise SystemExit('Нужны одновременно go.mod и cmd/pob2-engine.')
          if not module and any(Path('.').rglob('*.go')):
              raise SystemExit('Обнаружены Go-файлы без настроенного модуля и CLI.')
          if module and not any(Path('cmd/pob2-engine').glob('*.go')):
              raise SystemExit('В cmd/pob2-engine отсутствует точка входа Go.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'has_go={str(module).lower()}\n')
          print('Go-проверки включены.' if module else 'Этап документации: Go-программа ещё не добавлена.')
          PY
      - name: Проверить пробелы в последнем коммите
        run: git show --format= --check HEAD

  go:
    name: Go / Linux
    needs: structure
    if: needs.structure.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Проверить форматирование
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Проверить код
        run: go vet ./...
      - name: Проверить закреплённые источники эталона
        run: go run ./tool/reference
      - name: Проверить лицензии поставляемых зависимостей
        run: python3 tool/notices.py
      - name: Подготовить LuaJIT, закреплённый PoB и байткод моста
        env:
          POB2_ENGINE_POB_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tool/build_native_runtime.py
          go run ./cmd/pob2-engine pob-data ensure > pob-installation.json
          python3 tool/compile_pob_bytecode.py --installation pob-installation.json
          jq -r '"POB2_ENGINE_POB_DIR=" + .current.directory,
                 "POB2_ENGINE_POB_NATIVE_DIR=" + .current.nativeDirectory' pob-installation.json >> "$GITHUB_ENV"
      - name: Выполнить тесты
        env:
          GOFLAGS: -tags=pob_bytecode
        run: go test ./...
      - name: Проверить гонки
        env:
          GOFLAGS: -tags=pob_bytecode
        run: go test -race ./...
      - name: Измерить LuaJIT и сохранить состав среды
        shell: bash
        run: |
          mkdir -p .reference/performance
          go version > .reference/performance/go.txt
          go env -json GOOS GOARCH GOVERSION GOAMD64 CGO_ENABLED GOEXPERIMENT GOTOOLCHAIN > .reference/performance/environment.json
          lscpu > .reference/performance/cpu.txt
          git rev-parse HEAD > .reference/performance/commit.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > .reference/performance/measured-at.txt
          uname -a > .reference/performance/kernel.txt
          cat /etc/os-release > .reference/performance/os-release.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          options = {name: os.environ.get(name) for name in ('GOMAXPROCS', 'GOGC', 'GOMEMLIMIT')}
          Path('.reference/performance/runtime.json').write_text(json.dumps(options, indent=2) + '\n', encoding='utf-8')
          PY
          sha256sum testdata/reference/fireball.xml testdata/reference/0.0.2/cases/frostbolt-minimal.xml testdata/reference/0.0.2/cases/spark-minimal.xml internal/gamedata/files/catalog.json internal/gamedata/files/manifest.json > .reference/performance/inputs.sha256
          go test ./internal/pob -run '^$' -bench '^BenchmarkCalculators$' -benchmem -benchtime=500ms -count=3 | tee .reference/performance/spells.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: calculation-performance-linux
          path: .reference/performance/
          include-hidden-files: true
          if-no-files-found: error

  lua:
    name: Эталон Lua / Linux
    needs: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Проверить целостность эталонов и отказы инструментов
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Подготовить изолированную среду и воспроизвести расчёт
        run: python3 tool/reference_lua.py --prepare
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Проверить LuaJIT в Go, CLI, MCP и gRPC
        env:
          POB2_ENGINE_POB_DIR: ${{ github.workspace }}/.reference/pob
          POB2_ENGINE_POB_NATIVE_DIR: ${{ github.workspace }}/.reference/linux-x86_64/native
        run: go test ./internal/pob ./internal/transport/grpcapi ./internal/integration -run 'Test(LocalLuaJITCalculationAcrossGRPCAndMCP|Lua.*)' -count=1
      - name: Проверить воспроизводимость встроенных данных
        run: python3 tool/export_data.py
      - name: Воспроизвести матрицу расчётов и диагностики
        run: python3 tool/reference_cases.py
      - name: Воспроизвести заклинания холода и молнии
        run: python3 tool/reference_spells.py
      - name: Воспроизвести восемь базовых классов и выбор групп
        run: |
          python3 tool/reference_spells.py --matrix classes
          python3 tool/reference_spells.py --matrix groups
      - name: Воспроизвести Ice Nova и поддержку из полного каталога PoB
        run: python3 tool/reference_catalog.py
      - name: Воспроизвести многогрупповые сборки оригинального PoB
        run: python3 tool/reference_multigroup.py
      - name: Сверить расчёты с оригинальным PoB предыдущего выпуска
        run: |
          python3 tool/reference_upgrade.py
          go build -o .reference/upgrade-check ./cmd/pob2-engine
          python3 tool/smoke_upgrade.py .reference/upgrade-check
      - name: Сохранить отчёт и состав среды
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lua-reference-linux
          path: .reference/last-run/
          include-hidden-files: true
          if-no-files-found: warn

  proto:
    name: Protobuf и генерация API
    needs: structure
    if: needs.structure.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - name: Установить закреплённый Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.73.0
      - name: Проверить контракт
        run: |
          buf format --diff --exit-code
          buf lint
          if git cat-file -e origin/main:api/pob2/v1/session.proto 2>/dev/null; then
            buf breaking --against '.git#ref=origin/main'
          else
            echo 'В main ещё нет базового Protobuf-контракта для сравнения.'
          fi
      - name: Проверить воспроизводимость Go- и Dart-API
        run: go run ./tool/generate -check
      - name: Проверить сгенерированный Dart API
        working-directory: gen/dart
        run: |
          dart pub get --enforce-lockfile
          dart analyze

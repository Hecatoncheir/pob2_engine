name: Выпустить по тегу

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Проверить проект
    uses: ./.github/workflows/ci.yml

  version:
    name: Проверить тег и changelog
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Проверить принадлежность основной ветке
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Подготовить примечания версии
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from datetime import date
          from pathlib import Path
          import os
          import re

          tag = os.environ['RELEASE_TAG']
          pattern = r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*))?'
          match = re.fullmatch(pattern, tag)
          if not match:
              raise SystemExit('Ожидается тег vX.Y.Z или vX.Y.Z-alpha.1.')
          version = tag[1:]
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(
              rf'^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})\s*\n(.*?)(?=^## |\Z)',
              text, re.MULTILINE | re.DOTALL,
          )
          if section is None or not section.group(2).strip():
              raise SystemExit(f'Добавьте непустой раздел CHANGELOG.md для {version}.')
          date.fromisoformat(section.group(1))
          note = f'# pob2_engine {version}\n\n{section.group(2).strip()}\n'
          Path('release-notes.md').write_text(note, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'prerelease={str(match.group(4) is not None).lower()}\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Собрать ${{ matrix.goos }} / ${{ matrix.goarch }}
    needs: [validate, version]
    if: needs.validate.outputs.has_go == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            cgo: '0'
            extension: .exe
          - goos: linux
            goarch: amd64
            runner: ubuntu-22.04
            cgo: '1'
            extension: ''
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cgo: '1'
            extension: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Собрать самостоятельный файл
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=true -ldflags="-s -w -X github.com/Hecatoncheir/pob2_engine/internal/buildinfo.Version=${RELEASE_TAG}" \
            -o "dist/pob2_engine_${RELEASE_TAG}_${GOOS}_${GOARCH}${EXTENSION}" \
            ./cmd/pob2-engine
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pob2_engine_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.extension }}
          if-no-files-found: error

  smoke:
    name: Проверить выпуск / ${{ matrix.goos }} / ${{ matrix.goarch }}
    needs: [build, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            extension: .exe
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Проверить установку обновлений на целевой платформе
        run: go test ./internal/maintenance ./internal/pob
      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: Проверить бинарник и полный сценарий без среды разработки
        shell: bash
        env:
          POB2_ENGINE_POB_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          python -X utf8 tool/smoke_release.py --binary "dist/pob2_engine_${RELEASE_TAG}_${TARGET_OS}_${TARGET_ARCH}${EXTENSION}" \
            --tag "$RELEASE_TAG" --report "reports/smoke_${TARGET_OS}_${TARGET_ARCH}.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-${{ matrix.goos }}-${{ matrix.goarch }}
          path: reports/*.json
          if-no-files-found: error

  publish:
    name: Опубликовать выпуск
    needs: [validate, version, build, smoke]
    if: >-
      always() && needs.validate.result == 'success' &&
      needs.version.result == 'success' &&
      needs.build.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Сверить SHA-256 и опубликовать три бинарника
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist
          files=("pob2_engine_${RELEASE_TAG}_darwin_arm64"
                 "pob2_engine_${RELEASE_TAG}_linux_amd64"
                 "pob2_engine_${RELEASE_TAG}_windows_amd64.exe")
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          args=(--verify-tag --title "pob2_engine ${RELEASE_TAG}" --notes-file ../notes/release-notes.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" "${files[@]}" SHA256SUMS

  verify-published:
    name: Проверить скачанный выпуск / ${{ matrix.goos }} / ${{ matrix.goarch }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            extension: .exe
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Скачать опубликованный бинарник и повторить сценарий
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          POB2_ENGINE_POB_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          binary="pob2_engine_${RELEASE_TAG}_${TARGET_OS}_${TARGET_ARCH}${EXTENSION}"
          gh release download "$RELEASE_TAG" --pattern "$binary" --pattern SHA256SUMS --dir published
          python -X utf8 tool/smoke_release.py --binary "published/$binary" --checksums published/SHA256SUMS \
            --tag "$RELEASE_TAG" --report "reports/published_smoke_${TARGET_OS}_${TARGET_ARCH}.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: published-smoke-${{ matrix.goos }}-${{ matrix.goarch }}
          path: reports/*.json
          if-no-files-found: error

name: Выпустить движок

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Опубликованный кандидат vX.Y.Z-rc.N'
        required: true
        type: string
      app_run:
        description: 'Номер прогона полной приёмки PoB II'
        required: true
        type: string
      verify_only:
        description: 'Проверить условия публикации'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && contains(github.ref_name, '-') && github.ref_name || 'stable' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Проверить проект
    if: inputs.verify_only != true
    uses: ./.github/workflows/ci.yml

  version:
    name: Проверить тег и changelog
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.notes.outputs.tag }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Проверить принадлежность основной ветке
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Дождаться полной приёмки кандидата в PoB II
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ inputs.candidate }}
          APP_RUN: ${{ inputs.app_run }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          python3 tool/check_release_candidate.py "$CANDIDATE" "$APP_RUN"
      - name: Подготовить примечания версии
        id: notes
        env:
          PUSH_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          python3 - <<'PY'
          from datetime import date
          from pathlib import Path
          import os
          import re

          tag = os.environ['PUSH_TAG'] or os.environ['CANDIDATE'].rsplit('-rc.', 1)[0]
          pattern = r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*))?'
          match = re.fullmatch(pattern, tag)
          if not match:
              raise SystemExit('Ожидается тег vX.Y.Z или vX.Y.Z-alpha.1.')
          version = tag[1:]
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(
              rf'^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})\s*\n(.*?)(?=^## |\Z)',
              text, re.MULTILINE | re.DOTALL,
          )
          if section is None or not section.group(2).strip():
              raise SystemExit(f'Добавьте непустой раздел CHANGELOG.md для {version}.')
          date.fromisoformat(section.group(1))
          note = f'# pob2_engine {version}\n\n{section.group(2).strip()}\n'
          Path('release-notes.md').write_text(note, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\n')
              output.write(f'prerelease={str(match.group(4) is not None).lower()}\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Собрать ${{ matrix.goos }} / ${{ matrix.goarch }}
    needs: [validate, version]
    if: needs.validate.outputs.has_go == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            cgo: '0'
            extension: .exe
          - goos: linux
            goarch: amd64
            runner: ubuntu-22.04
            cgo: '1'
            extension: ''
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cgo: '1'
            extension: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Собрать библиотеки Lua для Linux и macOS
        if: runner.os != 'Windows'
        run: python3 tool/build_native_runtime.py
      - name: Собрать самостоятельный файл
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=true -ldflags="-s -w -X github.com/Hecatoncheir/pob2_engine/internal/buildinfo.Version=${RELEASE_TAG}" \
            -o "dist/pob2_engine_${RELEASE_TAG}_${GOOS}_${GOARCH}${EXTENSION}" \
            ./cmd/pob2-engine
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pob2_engine_${{ needs.version.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.extension }}
          if-no-files-found: error

  smoke:
    name: Проверить выпуск / ${{ matrix.goos }} / ${{ matrix.goarch }}
    needs: [build, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            extension: .exe
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Проверить установку обновлений на целевой платформе
        run: go test ./internal/maintenance ./internal/pob
      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: Проверить бинарник и полный сценарий без среды разработки
        shell: bash
        env:
          POB2_ENGINE_POB_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          python -X utf8 tool/smoke_release.py --binary "dist/pob2_engine_${RELEASE_TAG}_${TARGET_OS}_${TARGET_ARCH}${EXTENSION}" \
            --tag "$RELEASE_TAG" --report "reports/smoke_${TARGET_OS}_${TARGET_ARCH}.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-${{ matrix.goos }}-${{ matrix.goarch }}
          path: reports/*.json
          if-no-files-found: error

  publish:
    name: Опубликовать выпуск
    needs: [validate, version, build, smoke]
    if: >-
      always() && needs.validate.result == 'success' &&
      needs.version.result == 'success' &&
      needs.build.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Сверить SHA-256 и опубликовать три бинарника
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist
          files=("pob2_engine_${RELEASE_TAG}_darwin_arm64"
                 "pob2_engine_${RELEASE_TAG}_linux_amd64"
                 "pob2_engine_${RELEASE_TAG}_windows_amd64.exe")
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            existing=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG")
            if [[ -z "$existing" ]]; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" --silent
            elif [[ "$existing" != "$GITHUB_SHA"$'\t'"refs/tags/$RELEASE_TAG" ]]; then
              echo "Тег $RELEASE_TAG указывает на другой коммит"
              exit 1
            fi
          fi
          args=(--verify-tag --title "pob2_engine ${RELEASE_TAG}" --notes-file ../notes/release-notes.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" "${files[@]}" SHA256SUMS

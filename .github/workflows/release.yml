name: Выпустить по тегу

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Проверить проект
    uses: ./.github/workflows/ci.yml

  version:
    name: Проверить тег и changelog
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Проверить принадлежность основной ветке
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Подготовить примечания версии
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from datetime import date
          from pathlib import Path
          import os
          import re

          tag = os.environ['RELEASE_TAG']
          pattern = r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*))?'
          match = re.fullmatch(pattern, tag)
          if not match:
              raise SystemExit('Ожидается тег vX.Y.Z или vX.Y.Z-alpha.1.')
          version = tag[1:]
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(
              rf'^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})\s*\n(.*?)(?=^## |\Z)',
              text, re.MULTILINE | re.DOTALL,
          )
          if section is None or not section.group(2).strip():
              raise SystemExit(f'Добавьте непустой раздел CHANGELOG.md для {version}.')
          date.fromisoformat(section.group(1))
          note = f'# pob2_engine {version}\n\n{section.group(2).strip()}\n'
          if not Path('go.mod').is_file():
              note += '\nЭтот выпуск содержит исходники и документацию. Go-движок ещё не реализован; исполняемых файлов нет.\n'
          Path('release-notes.md').write_text(note, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'prerelease={str(match.group(4) is not None).lower()}\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Собрать ${{ matrix.goos }} / ${{ matrix.goarch }}
    needs: [validate, version]
    if: needs.validate.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: linux
            goarch: amd64
            extension: ''
          - goos: darwin
            goarch: arm64
            extension: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Собрать самостоятельный файл
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X github.com/Hecatoncheir/pob2_engine/internal/buildinfo.Version=${RELEASE_TAG}" \
            -o "dist/pob2_engine_${RELEASE_TAG}_${GOOS}_${GOARCH}${EXTENSION}" \
            ./cmd/pob2-engine
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Опубликовать выпуск
    needs: [validate, version, build]
    if: >-
      always() && needs.validate.result == 'success' &&
      needs.version.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@v8.0.2
        if: needs.validate.outputs.has_go == 'true'
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Подготовить исходники и контрольные суммы
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="pob2_engine-${RELEASE_TAG}/" \
            --output="dist/pob2_engine_${RELEASE_TAG}_source.tar.gz" HEAD
          git archive --format=zip --prefix="pob2_engine-${RELEASE_TAG}/" \
            --output="dist/pob2_engine_${RELEASE_TAG}_source.zip" HEAD
          git rev-parse HEAD > dist/COMMIT.txt
          python3 tool/notices.py --archive "dist/pob2_engine_${RELEASE_TAG}_licenses.zip"
          cd dist
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "pob2_engine ${RELEASE_TAG}" --notes-file notes/release-notes.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/*

version: v2
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2]
    out: gen/go
    opt: paths=source_relative
  - local: [dart, --packages=tool/proto/.dart_tool/package_config.json, tool/proto/bin/protoc_gen_dart.dart]
    out: gen/dart/lib
    opt: grpc

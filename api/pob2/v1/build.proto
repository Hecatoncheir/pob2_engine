syntax = "proto3";

package pob2.v1;

option go_package = "github.com/Hecatoncheir/pob2_engine/gen/go/pob2/v1;pob2v1";

enum ConfigValueType {
  CONFIG_VALUE_TYPE_UNSPECIFIED = 0;
  CONFIG_VALUE_TYPE_BOOLEAN = 1;
  CONFIG_VALUE_TYPE_NUMBER = 2;
  CONFIG_VALUE_TYPE_STRING = 3;
}

// Лексическое значение сохраняется для точного повтора аргументов команды.
message ConfigValue {
  ConfigValueType type = 1;
  string value = 2;
}

message BuildIssue {
  string code = 1;
  string path = 2;
  string message = 3;
}

message ActiveSets {
  uint32 skills = 1;
  uint32 items = 2;
  uint32 tree = 3;
  uint32 config = 4;
}

message BuildGem {
  string id = 1;
  string name = 2;
  string skill_id = 3;
  string variant_id = 4;
  uint32 level = 5;
  uint32 quality = 6;
  bool enabled = 7;
  uint32 stat_set = 8;
  bool corrupted = 9;
}

message SkillGroup {
  uint32 id = 1;
  string label = 2;
  bool enabled = 3;
  uint32 main_skill = 4;
  repeated BuildGem gems = 5;
}

message BuildItem {
  uint32 id = 1;
  string raw = 2;
}

message BuildModel {
  string target_version = 1;
  string tree_version = 2;
  string class_name = 3;
  uint32 class_id = 4;
  string ascendancy = 5;
  uint32 ascendancy_id = 6;
  uint32 level = 7;
  uint32 main_group = 8;
  uint32 weapon_set = 9;
  ActiveSets active_sets = 10;
  repeated SkillGroup groups = 11;
  repeated BuildItem items = 12;
  map<string, uint32> slots = 13;
  repeated uint32 nodes = 14;
  map<string, ConfigValue> config = 15;
  repeated BuildIssue issues = 16;
  // Сохранённые атрибуты назначенных узлов активной спецификации.
  map<uint32, string> passive_attributes = 17;
  // Режимы назначенных узлов в ветвях оружия активной спецификации.
  map<uint32, string> passive_allocations = 18;
  // ID предметов в гнёздах активной спецификации по ID узлов.
  map<uint32, uint32> passive_jewels = 19;
}

enum CalculationStatus {
  CALCULATION_STATUS_UNSPECIFIED = 0;
  CALCULATION_STATUS_COMPLETE = 1;
  CALCULATION_STATUS_PARTIAL = 2;
  CALCULATION_STATUS_UNSUPPORTED = 3;
}

message AppliedModifier {
  string stat = 1;
  string kind = 2;
  double value = 3;
  string source = 4;
}

message CalculationResult {
  CalculationStatus status = 1;
  string data_id = 2;
  string data_sha256 = 3;
  string pob_commit = 4;
  string input_sha256 = 5;
  string skill = 6;
  string mode = 7;
  map<string, double> stats = 8;
  repeated AppliedModifier modifiers = 9;
  repeated BuildIssue issues = 10;
}

message BuildDocument {
  string xml = 1;
  string input_sha256 = 2;
  uint64 input_revision = 3;
  BuildModel model = 4;
  CalculationResult calculation = 5;
  uint64 calculated_from_revision = 6;
}

message LevelEdit {
  uint32 level = 1;
}

message ConfigEdit {
  string name = 1;
  // Отсутствие value удаляет условие.
  ConfigValue value = 2;
}

message GemInput {
  string id = 1;
  uint32 level = 2;
  uint32 quality = 3;
  bool enabled = 4;
}

message GemsEdit {
  // Ноль добавляет группу в конец выбранного набора.
  uint32 group_id = 1;
  string label = 2;
  bool enabled = 3;
  bool delete = 4;
  repeated GemInput gems = 5;
}

message EquipmentEdit {
  string slot = 1;
  // Без текста и ID предмет снимается.
  string raw = 2;
  uint32 item_id = 3;
}

message PassivesEdit {
  repeated uint32 nodes = 1;
}

message JewelEdit {
  uint32 node_id = 1;
  // Выберите предмет из сборки либо передайте его текст. Без обоих полей самоцвет снимается.
  uint32 item_id = 2;
  string raw = 3;
}

message SelectionEdit {
  ActiveSets sets = 1;
  uint32 main_group = 2;
  uint32 weapon_set = 3;
}

message AddSupportEdit {
  // Идентификатор поддержки из каталога PoB.
  string support_id = 1;
  // Ноль означает первый уровень.
  uint32 level = 2;
  uint32 quality = 3;
}

message TreeNodeEdit {
  uint32 node_id = 1;
  // allocate, refund или set_attribute в активной спецификации.
  string action = 2;
  // strength, dexterity или intelligence. При allocate поле необязательно.
  string attribute = 3;
  // common, weapon_set_1 или weapon_set_2. Отсутствие сохраняет поведение 0.0.11.
  string allocation_mode = 4;
}

message TreeClassEdit {
  uint32 class_id = 1;
  uint32 ascendancy_id = 2;
  // Пустой режим сохраняет путь. connect соединяет путь, reset сбрасывает узлы.
  string mode = 3;
}

message BuildEdit {
  oneof operation {
    LevelEdit level = 1;
    ConfigEdit config = 2;
    GemsEdit gems = 3;
    EquipmentEdit equipment = 4;
    PassivesEdit passives = 5;
    SelectionEdit selection = 6;
    AddSupportEdit add_support = 7;
    TreeNodeEdit tree_node = 8;
    JewelEdit jewel = 9;
    TreeClassEdit tree_class = 10;
  }
}

message PassiveChange {
  repeated uint32 added = 1;
  repeated uint32 removed = 2;
  repeated PassiveAttributeChange attributes = 3;
  repeated PassiveAllocationChange allocations = 4;
  PassivePointsChange points = 5;
}

message PassiveAllocationChange {
  uint32 node_id = 1;
  // Пустой режим означает, что узел не был назначен.
  string before = 2;
  string after = 3;
}

message PassivePoints {
  uint32 passives = 1;
  uint32 weapon_set_1 = 2;
  uint32 weapon_set_2 = 3;
}

message PassivePointsChange {
  PassivePoints before = 1;
  PassivePoints after = 2;
}

message PassiveAttributeChange {
  uint32 node_id = 1;
  // Пустое значение, если PoB ещё не назначил атрибут.
  string before = 2;
  string after = 3;
}

message StatDelta {
  string stat = 1;
  double before = 2;
  double after = 3;
  double difference = 4;
}

message BuildComparison {
  CalculationResult before = 1;
  CalculationResult after = 2;
  // Пуст при неподдержанном варианте; это не нулевые значения показателей.
  repeated StatDelta deltas = 3;
}

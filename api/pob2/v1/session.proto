syntax = "proto3";

package pob2.v1;

import "pob2/v1/build.proto";
import "pob2/v1/catalog.proto";
import "pob2/v1/maintenance.proto";

option go_package = "github.com/Hecatoncheir/pob2_engine/gen/go/pob2/v1;pob2v1";

// SessionService предоставляет общий сервис сессий первого этапа.
service SessionService {
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Doctor(DoctorRequest) returns (DoctorResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc CreateSessionFromXml(CreateSessionFromXmlRequest) returns (CreateSessionFromXmlResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc RenameBuild(RenameBuildRequest) returns (RenameBuildResponse);
  rpc ApplyBuild(ApplyBuildRequest) returns (ApplyBuildResponse);
  rpc CalculateBuild(CalculateBuildRequest) returns (stream CalculateBuildResponse);
  rpc CompareBuild(CompareBuildRequest) returns (CompareBuildResponse);
  rpc GetTreeGeometry(GetTreeGeometryRequest) returns (GetTreeGeometryResponse);
  rpc GetTreeNodeTooltip(GetTreeNodeTooltipRequest) returns (GetTreeNodeTooltipResponse);
  rpc GetBuildReport(GetBuildReportRequest) returns (GetBuildReportResponse);
  rpc GetTreePower(GetTreePowerRequest) returns (GetTreePowerResponse);
  rpc GetEquipmentDetails(GetEquipmentDetailsRequest) returns (GetEquipmentDetailsResponse);
  rpc GetTreeTexture(GetTreeTextureRequest) returns (GetTreeTextureResponse);
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);
  rpc PreviewSupport(PreviewSupportRequest) returns (PreviewSupportResponse);
  rpc ExportBuild(ExportBuildRequest) returns (ExportBuildResponse);
  rpc WatchSession(WatchSessionRequest) returns (stream WatchSessionResponse);
  rpc WatchServer(WatchServerRequest) returns (stream WatchServerResponse);
  rpc WatchEditor(WatchEditorRequest) returns (stream WatchEditorResponse);
  rpc CallEditor(CallEditorRequest) returns (CallEditorResponse);
  rpc ReplyEditor(ReplyEditorRequest) returns (ReplyEditorResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc RegisterClient(RegisterClientRequest) returns (RegisterClientResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReleaseClient(ReleaseClientRequest) returns (ReleaseClientResponse);
}

// Приложение открывает поток только после разрешения на правки через MCP.
message WatchEditorRequest {
  string session_id = 1;
}

message CallEditorRequest {
  string session_id = 1;
  string tool = 2;
  string arguments_json = 3;
}

message WatchEditorResponse {
  string request_id = 1;
  string tool = 2;
  string arguments_json = 3;
  // Первое сообщение подтверждает привязку потока к сессии.
  bool attached = 4;
}

message CallEditorResponse {
  string result_json = 1;
}

message ReplyEditorRequest {
  string session_id = 1;
  string request_id = 2;
  string result_json = 3;
}

message ReplyEditorResponse {}

message SessionSnapshot {
  string session_id = 1;
  string build_name = 2;
  uint64 revision = 3;
  BuildDocument build = 4;
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  string version = 1;
  string protocol_version = 2;
  repeated string capabilities = 3;
  string state = 4;
  string instance_id = 5;
  string mode = 6;
  uint32 client_count = 7;
  uint32 active_tasks = 8;
  uint64 lease_timeout_ms = 9;
  string storage_mode = 10;
  string storage_path = 11;
}

// request_id повторяется только для точного повтора той же команды.
message CreateSessionRequest {
  string session_id = 1;
  string build_name = 2;
  string request_id = 3;
}

message CreateSessionResponse {
  SessionSnapshot snapshot = 1;
}

// Создаёт сессию и сохраняет XML в первой ревизии одной командой.
message CreateSessionFromXmlRequest {
  string session_id = 1;
  string build_name = 2;
  string request_id = 3;
  string xml = 4;
}

message CreateSessionFromXmlResponse {
  SessionSnapshot snapshot = 1;
}

message GetSnapshotRequest {
  string session_id = 1;
}

message GetSnapshotResponse {
  SessionSnapshot snapshot = 1;
}

// Точный повтор возвращает исходный результат даже после последующих правок.
message RenameBuildRequest {
  string session_id = 1;
  string build_name = 2;
  uint64 expected_revision = 3;
  string request_id = 4;
}

message RenameBuildResponse {
  SessionSnapshot snapshot = 1;
}

// Ноль запрашивает начальный снимок; иначе возвращаются все последующие правки.
message WatchSessionRequest {
  string session_id = 1;
  uint64 after_revision = 2;
}

message WatchSessionResponse {
  SessionSnapshot snapshot = 1;
  string kind = 2;
  string request_id = 3;
  repeated string changed_fields = 4;
  string previous_build_name = 5;
}

message ShutdownRequest {}

// Поток не продлевает аренду и не считается вычислительной задачей.
message WatchServerRequest {}

// Сначала текущая фаза, затем переход в draining и штатный конец потока.
// sequence относится только к instance_id; событие stopped по сети не обещается.
message WatchServerResponse {
  string instance_id = 1;
  uint64 sequence = 2;
  string state = 3;
  string reason = 4;
  uint64 shutdown_timeout_ms = 5;
}

message ShutdownResponse {}

// client_id обозначает приложение, а не TCP-соединение или отдельный RPC.
message RegisterClientRequest {
  string client_id = 1;
  string kind = 2;
}

message RegisterClientResponse {
  string lease_id = 1;
  uint64 lease_timeout_ms = 2;
}

message HeartbeatRequest {
  string lease_id = 1;
}

message HeartbeatResponse {}

// Освобождение уже отсутствующей аренды безопасно.
message ReleaseClientRequest {
  string lease_id = 1;
}

message ReleaseClientResponse {}

message ApplyBuildRequest {
  string session_id = 1;
  uint64 expected_revision = 2;
  string request_id = 3;
  oneof input {
    string xml = 4;
    BuildEdit edit = 5;
  }
}

message ApplyBuildResponse {
  SessionSnapshot snapshot = 1;
}

message CalculateBuildRequest {
  string session_id = 1;
  uint64 expected_revision = 2;
  string request_id = 3;
}

// Промежуточные этапы могут объединяться; последний ответ всегда содержит snapshot.
message CalculateBuildResponse {
  string stage = 1;
  SessionSnapshot snapshot = 2;
}

message CompareBuildRequest {
  string session_id = 1;
  uint64 expected_revision = 2;
  oneof input {
    string xml = 3;
    BuildEdit edit = 4;
  }
}

message CompareBuildResponse {
  string session_id = 1;
  uint64 revision = 2;
  BuildComparison comparison = 3;
  // Заполняется для правки отдельного узла оригинального PoB.
  PassiveChange passive_change = 4;
}

message ExportBuildRequest {
  string session_id = 1;
}

message ExportBuildResponse {
  string session_id = 1;
  uint64 revision = 2;
  string xml = 3;
  string input_sha256 = 4;
}
